name: Grocery Tests

# Run on every PR and again whenever a new commit is pushed to the PR branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # Let each commit's run finish so its comment is posted (don't cancel in-progress).
  group: grocery-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  grocery-tests:
    name: Grocery backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run grocery tests
        id: tests
        working-directory: backend
        continue-on-error: true # let the workflow post a comment even when tests fail
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress -Dtest='Grocery*Test' test

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportsDir = 'backend/target/surefire-reports';
            const cases = [];

            if (fs.existsSync(reportsDir)) {
              const files = fs.readdirSync(reportsDir)
                .filter(f => f.startsWith('TEST-') && f.endsWith('.xml'));
              for (const file of files) {
                const xml = fs.readFileSync(path.join(reportsDir, file), 'utf8');
                const re = /<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
                let m;
                while ((m = re.exec(xml)) !== null) {
                  const attrs = m[1] || '';
                  const inner = m[2] || '';
                  const nameMatch = attrs.match(/name="([^"]*)"/);
                  const name = nameMatch ? nameMatch[1] : '(unknown)';
                  let status = 'passed';
                  if (/<failure\b/.test(inner) || /<error\b/.test(inner)) status = 'failed';
                  else if (/<skipped\b/.test(inner)) status = 'skipped';
                  cases.push({ name, status });
                }
              }
            }

            const failed = cases.filter(c => c.status === 'failed');
            const skipped = cases.filter(c => c.status === 'skipped');
            const passed = cases.filter(c => c.status === 'passed');
            const total = cases.length;

            const sha = (context.payload.pull_request.head.sha || '').substring(0, 7);
            let body = `## 🛒 Grocery Tests — \`${sha}\`\n\n`;

            if (total === 0) {
              body += `⚠️ **No test results were produced** — the grocery tests failed to `
                    + `compile or run (step outcome: \`${process.env.TEST_OUTCOME}\`). `
                    + `Check the workflow logs.\n`;
            } else if (failed.length === 0) {
              body += `✅ **All ${total} grocery tests passed.**`;
              if (skipped.length) body += `  _(${skipped.length} skipped)_`;
              body += `\n`;
            } else {
              body += `❌ **${failed.length} of ${total} grocery tests failed:**\n\n`;
              for (const c of failed) body += `- \`${c.name}\`\n`;
              body += `\n<details><summary>${passed.length} passed`;
              if (skipped.length) body += `, ${skipped.length} skipped`;
              body += `</summary>\n\n`;
              for (const c of passed) body += `- \`${c.name}\` ✅\n`;
              for (const c of skipped) body += `- \`${c.name}\` ⚪️\n`;
              body += `\n</details>\n`;
            }

            // Always post a brand-new comment for this commit.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

            if (total === 0 || failed.length > 0) {
              core.setFailed(`Grocery tests failing: ${failed.length} failed of ${total}.`);
            }

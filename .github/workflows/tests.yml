name: Tests

# Every PR (and each new commit on it) plus anything pushed to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a new push to the same PR/branch cancels the older run
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run all backend tests
        id: tests
        working-directory: backend
        env:
          # Throwaway values so the app can start. Tests use in-memory storage and fakes:
          # nothing connects to AWS, OpenAI, Twilio or Plaid, and no real secrets are needed.
          JWT_SECRET_KEY: ci-test-secret
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy
          AWS_REGION: us-east-1
        run: |
          chmod +x ./mvnw
          set +e
          ./mvnw -B --no-transfer-progress test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/test_summary.py backend backend/target/surefire-reports backend-summary.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results
          path: |
            backend-summary.json
            backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Fail if any test failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  ios:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: CI build settings
        # Config.xcconfig is gitignored (it holds real keys). Unit tests only need placeholders.
        run: |
          cat > PlotLine/Config.xcconfig <<'CONFIG'
          BACKEND_BASE_URL = https:/$()/ci.example.invalid
          GID_CLIENT_ID = 000000000000-ci.apps.googleusercontent.com
          GID_CLIENT_ID_REVERSED = com.googleusercontent.apps.000000000000-ci
          GID_SERVER_CLIENT_ID = 000000000001-ci.apps.googleusercontent.com
          NEWS_KEY = ci
          STOCK_KEY = ci
          PLOTLINE_API_KEY = ci
          USDA_FDC_API_KEY = DEMO_KEY
          CONFIG

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: spm-packages
          key: spm-${{ hashFiles('PlotLine/PlotLine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: [int(p) for p in x[0].split("iOS-")[-1].split("-")])
          print(ios[-1][1]["udid"])')
          echo "Using simulator $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        id: tests
        working-directory: PlotLine
        run: |
          set +e
          xcodebuild test \
            -project PlotLine.xcodeproj \
            -scheme PlotLine \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:PlotLineTests \
            -clonedSourcePackagesDirPath ../spm-packages \
            -resultBundlePath ../ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize results
        if: always()
        run: python3 .github/scripts/test_summary.py ios ios-tests.xcresult ios-summary.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: ios-summary.json
          if-no-files-found: ignore

      - name: Fail if any test failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  report:
    name: Post results to the PR
    needs: [backend, ios]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: results
        continue-on-error: true

      - name: Build comment
        run: |
          python3 .github/scripts/test_summary.py comment \
            results/backend-results/backend-summary.json \
            results/ios-results/ios-summary.json \
            "${{ github.event.pull_request.head.sha }}" \
            comment.md

      - name: Post or update the comment
        uses: actions/github-script@v7
        continue-on-error: true # PRs from forks get a read-only token
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- plotline-test-results -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

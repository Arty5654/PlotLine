spring.application.name=backend

server.port=${PORT:8080}
server.address=0.0.0.0

cloud.aws.s3.bucket=plotline-database-bucket

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Postgres (Neon). DATABASE_URL is the JDBC connection string, e.g.
# jdbc:postgresql://<host>/<db>?user=<user>&password=<password>&sslmode=require
spring.datasource.url=${DATABASE_URL:}
spring.datasource.hikari.maximum-pool-size=5
# Fly suspends this server after a few idle minutes, and Neon drops connections while it sleeps.
# Connections kept open across a suspend are dead on wake-up but look open, and checking each one
# used to take ~10s, so the first requests after a wake waited 30-50s. So: close idle connections
# after 10s (the pool is empty before Fly suspends), retire every connection within 4 minutes
# (before Neon's 5-minute idle cut-off), and give up on an unresponsive one after 1s.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.connection-timeout=15000

# Logging (SLF4J). INFO shows warnings, errors and key events (account deletion, the one-time
# database import). Per-request detail (Plaid sync steps, transactions, costs) is DEBUG: turn it on
# temporarily with `fly secrets set LOGGING_LEVEL_COM_PLOTLINE=DEBUG` (or the line below locally).
logging.level.com.plotline=INFO
